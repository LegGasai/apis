apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volcano-app
  template:
    metadata:
      labels:
        app: volcano-app
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      schedulerName: volcano
